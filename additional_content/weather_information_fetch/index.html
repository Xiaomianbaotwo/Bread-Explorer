<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>天气 API 查询工具</title>
  <link rel="stylesheet" href="css/01-style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2338bdf8' d='M6.5 19a4.5 4.5 0 0 1-.42-8.98 6 6 0 0 1 11.62 1.62A3.75 3.75 0 0 1 17 19H6.5z'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19a4.5 4.5 0 0 0 .42-8.98 6 6 0 0 0-11.62 1.62A3.75 3.75 0 0 0 7 19h10.5z"/>
          </svg>
        </div>
        <div>
          <h1>天气 API 查询工具</h1>
          <div class="sub">输入城市名称 · 自动定位编码 · 返回原始 JSON</div>
        </div>
      </div>
    </header>

    <section class="panel" style="margin-bottom: 24px; padding: 20px 26px;">
      <h3 style="margin-bottom: 12px;">全局配置</h3>
      <div class="form-row" style="grid-template-columns: 1fr auto; align-items: center;">
        <div class="field">
          <label for="globalApiKey">和风天气 API Key（只需在此填写一次，即可全局通用）</label>
          <input type="password" id="globalApiKey" placeholder="请输入你的和风天气 API Key" autocomplete="off" />
        </div>
        <button class="btn" id="saveKeyBtn" style="height: 45px;">保存</button>
      </div>
      <div class="hint" id="keyStatus" style="margin-top: 10px; color: var(--ok); display: none;">
        ✓ API Key 已保存在本机浏览器中。
      </div>
    </section>

    <section class="hero" style="margin-top: 10px;">
      <h2>选择查询区域</h2>
      <p>国内版对接和风天气（中国境内城市）；国外版对接和风天气全球搜索。查询结果可一键复制或下载为 JSON 文件。</p>
    </section>

    <section class="entry-grid">
      <a class="entry-card domestic" href="pages/domestic.html">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/>
          </svg>
        </div>
        <h3>国内版 · 和风天气</h3>
        <p>面向中国境内城市，限定范围查询 Location ID，返回实况天气原始 JSON。</p>
        <div class="tag-row">
          <span class="tag">中国境内</span>
          <span class="tag">精确到市</span>
        </div>
      </a>

      <a class="entry-card overseas" href="pages/overseas.html">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M2.5 9h19M2.5 15h19M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/>
          </svg>
        </div>
        <h3>国外版 · 和风天气</h3>
        <p>面向中国境外城市，全球范围匹配城市 Location ID，返回实况天气原始 JSON。</p>
        <div class="tag-row">
          <span class="tag">境外城市</span>
          <span class="tag">全球匹配</span>
        </div>
      </a>
    </section>

    <footer class="footer">
      提示：数据内容以天气服务商接口返回为准。
    </footer>
  </div>

  <!-- 【新增】先加载页面语言适配（独立页，取 localStorage 里的 bb-language） -->
  <script src="js/04-i18n.js"></script>
  <script src="js/05-dev-gate.js"></script>
  <!-- 引入写好的 common.js -->
  <script src="js/01-common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const keyInput = document.getElementById('globalApiKey');
      const saveBtn = document.getElementById('saveKeyBtn');
      const keyStatus = document.getElementById('keyStatus');

      // 回显本地缓存的 Key
      const savedKey = localStorage.getItem("qweather_key");
      if (savedKey) {
        keyInput.value = savedKey;
        keyStatus.style.display = "block";
      }

      saveBtn.addEventListener('click', async () => {
        const key = keyInput.value.trim();
        
        // 拦截空 Key
        if (!key) {
          keyStatus.textContent = T("✕ 请输入有效的 API Key", "✕ Please enter a valid API Key");
          keyStatus.style.color = "var(--err)";
          keyStatus.style.display = "block";
          setTimeout(() => { keyStatus.style.display = "none"; }, 3000);
          return;
        }

        // 存到本地
        localStorage.setItem("qweather_key", key);
        
        const savedUser = localStorage.getItem('bb-current-user');
        if (savedUser) {
          try {
            const currentName = JSON.parse(savedUser);
            const usersDB = JSON.parse(localStorage.getItem('bb-users') || '{}');
            const currentUid = usersDB[currentName]?.user_id;

            if (currentUid) {
              saveBtn.textContent = T('同步中...', 'Syncing...');
              saveBtn.disabled = true;

              // ★ 修正后的 fetch 请求（去掉了重复的配置，加上了 on_conflict）
              const res = await fetch('https://txlozorhwmkpvrbkmyfn.supabase.co/rest/v1/bread_weather_config?on_conflict=user_id', {
                method: 'POST',
                headers: {
                  'apikey': 'sb_publishable_VkgDzUbskjLJIVlLezUvTw_YSVungPy',
                  'Authorization': 'Bearer sb_publishable_VkgDzUbskjLJIVlLezUvTw_YSVungPy',
                  'Content-Type': 'application/json',
                  'Prefer': 'resolution=merge-duplicates'
                },
                body: JSON.stringify({
                  username: currentName,
                  user_id: currentUid,
                  qweather_key: key,
                  qweather_host: "pe3yfv7mpt.re.qweatherapi.com",
                  updated_at: new Date().toISOString()
                })
              });
              
              saveBtn.textContent = T('保存', 'Save');
              saveBtn.disabled = false;

              if (res.ok) {
                keyStatus.textContent = T("✓ API Key 已成功同步至天气库云端", "✓ API Key synced to the cloud weather database");
                keyStatus.style.color = "var(--ok)";
              } else {
                const errData = await res.json();
                console.error("保存失败", errData);
                keyStatus.textContent = T("✓ 已保存在本机 (云端同步失败)", "✓ Saved locally (cloud sync failed)");
                keyStatus.style.color = "var(--warn)";
              }
            }
          } catch (e) {
            console.error('云端同步失败', e);
            keyStatus.textContent = T("✓ 已保存在本机", "✓ Saved locally");
            keyStatus.style.color = "var(--ok)";
          }
        } else {
          keyStatus.textContent = T("✓ API Key 已保存在本机浏览器中", "✓ API Key saved in this browser");
          keyStatus.style.color = "var(--ok)";
        }

        keyStatus.style.display = "block";
        setTimeout(() => { 
          keyStatus.style.display = "none"; 
          keyStatus.style.color = "var(--ok)"; 
        }, 3000);
      });
    });
  </script>
</body>
</html>
